# Included in the existing HTTPS server block.
location = /xiaoheihehe { return 301 /xiaoheihehe/; }
location = /xiaoheihehe/ {
    rewrite ^ /xiaoheihehe/index.html last;
}
location = /xiaoheihehe/index.html {
    alias /opt/xiaoheihehe-updates/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location = /xiaoheihehe/api/version {
    alias /opt/xiaoheihehe-updates/latest.json;
    default_type application/json;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ^~ /xiaoheihehe/releases/ {
    alias /opt/xiaoheihehe-updates/releases/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition "attachment";
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location /xiaoheihehe/ { return 404; }
